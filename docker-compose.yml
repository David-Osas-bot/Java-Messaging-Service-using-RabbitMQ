
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: java-messaging-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: osas
      RABBITMQ_DEFAULT_PASS: devpassword123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  rabbitmq_data:
